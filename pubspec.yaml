name: buildmate
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^17.2.1+2

  zego_uikit_prebuilt_call: ^4.22.4
  zego_uikit_signaling_plugin: 2.8.20

  intl: ^0.19.0
  image_picker: ^1.0.7
  provider: ^6.1.1
  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.5
  font_awesome_flutter: ^10.12.0
  onesignal_flutter: ^5.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  zego_zim: 2.27.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
